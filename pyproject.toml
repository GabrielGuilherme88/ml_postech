[project]
name = "datathon-fase05"
version = "0.2.0"
description = "Datathon Fase 05 - Auditoria de Saúde com MLOps, RAGAS e Guardrails"
authors = [
    { name = "Grupo XX", email = "gabrielsalla@hotmail.com" }
]
dependencies = [
    "a2wsgi",
    "accelerate",
    "fastapi",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langfuse",
    "matplotlib",
    "mlflow",
    "openai",
    "pandas",
    "requests",
    "presidio-analyzer",
    "presidio-anonymizer",
    "prometheus-client",
    "prometheus-fastapi-instrumentator",
    "python-dotenv",
    "scikit-learn",
    "seaborn",
    "skops",
    "torch",
    "transformers",
    "uvicorn",
    "structlog",
    "evidently==0.4.28",
    "apache-airflow[postgres]==2.9.0",
    "psycopg2-binary",
    "pluggy==1.6.0"
]
requires-python = ">=3.10"

[project.scripts]
drift-detection = "src.monitoring.drift_detection:run_drift_detection"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
    "dvc",
    "httpx"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
strict = false
exclude = ["ambi", ".venv", "venv"]
disallow_untyped_defs = false
check_untyped_defs = false
