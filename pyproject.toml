[project]
name = "datathon-fase05"
version = "0.1.0"
description = "Datathon Fase 05 - MLOps, LLMs e Agentes"
authors = [
    { name = "Grupo XX", email = "gabrielsalla@hotmail.com" }
]
dependencies = [
    "a2wsgi",
    "accelerate",
    "datasets",
    "evidently",
    "fastapi",
    "langchain",
    "langchain-community",
    "langchain-openai",
    "langgraph",
    "mlflow",
    "openai",
    "pandas",
    "pandera",
    "presidio-analyzer",
    "presidio-anonymizer",
    "python-dotenv",
    "ragas",
    "scikit-learn",
    "seaborn",
    "skops",
    "torch",
    "transformers",
    "uvicorn"
]
requires-python = ">=3.10"

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
    "mypy",
    "bandit",
    "dvc",
    "httpx"
]

[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.mypy]
ignore_missing_imports = true
strict = true
