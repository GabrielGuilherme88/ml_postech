stages:
  prepare_data:
    cmd: PYTHONPATH=. python db_lite/create_db.py && PYTHONPATH=. python db_lite/data_base.py
    deps:
      - db_lite/create_db.py
      - db_lite/data_base.py
    outs:
      - db_lite/meu_banco_de_dados.db

  train:
    cmd: PYTHONPATH=. python src/models/train.py
    deps:
      - db_lite/meu_banco_de_dados.db
      - src/models/train.py
    outs:
      - src/models/modelo_glosa.skops
      - src/models/features_modelo.json

  inference:
    cmd: PYTHONPATH=. python src/models/insert_db_model.py
    deps:
      - src/models/modelo_glosa.skops
      - src/models/features_modelo.json
      - src/models/insert_db_model.py
      - db_lite/meu_banco_de_dados.db
    outs:
      - db_lite/meu_banco_de_dados_model.db

  evaluate:
    cmd: PYTHONPATH=. python evaluation/mlflow_eval.py
    deps:
      - evaluation/mlflow_eval.py
      - data/golden_set/golden_set.json
      - db_lite/meu_banco_de_dados.db

  drift:
    cmd: PYTHONPATH=. python src/monitoring/drift_detection.py
    deps:
      - src/monitoring/drift_detection.py
      - db_lite/meu_banco_de_dados.db
      - db_lite/meu_banco_de_dados_model.db
    outs:
      - reports/drift_report.html