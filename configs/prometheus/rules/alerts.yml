groups:
  - name: api_alerts
    rules:
      - alert: HighLatency
        expr: histogram_quantile(0.99, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High API latency detected"
          description: "P99 latency is {{ $value | printf \"%.2f\" }}s"

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.01
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "Error rate is {{ $value | printf \"%.2f\" }} errors/s"

      - alert: APIDown
        expr: up{job="ana-api"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "API is down"
          description: "The API has been down for more than 30 seconds"

  - name: llm_quality_alerts
    rules:
      - alert: LowFaithfulness
        expr: langfuse_faithfulness_score < 0.7
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "LLM faithfulness score is low"
          description: "Faithfulness score: {{ $value }}"

      - alert: HighRelevancy
        expr: langfuse_relevancy_score > 0.9
        for: 5m
        labels:
          severity: info
        annotations:
          summary: "LLM relevancy score is excellent"
          description: "Relevancy score: {{ $value }}"
