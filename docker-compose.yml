services:
  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    ports:
      - "5000:5000"
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/mlflow.db --artifacts-destination /mlflow/artifacts --serve-artifacts
    volumes:
      - mlflow_data:/mlflow

  api:
    build:
      context: .
      dockerfile: ./src/serving/Dockerfile
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - .:/app
      - hf_cache:/app/models_cache
    depends_on:
      - mlflow
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app # <--- ADICIONE ESTA LINHA

  training:
    build:
      context: .
      dockerfile: ./src/serving/Dockerfile
    env_file:
      - .env
    volumes:
      - .:/app
    command: dvc repro
    profiles:
      - training
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - PYTHONPATH=/app # <--- ADICIONE ESTA LINHA

  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    depends_on:
      - prometheus

volumes:
  hf_cache:
  mlflow_data:
