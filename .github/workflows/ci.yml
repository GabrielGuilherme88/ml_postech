name: Machine Learning CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Linting (Quality Check)
        run: make lint

      - name: Run Unit Tests
        run: make test

      - name: Run Security Guardrails Tests
        run: make -f Makefile.guardrails test

  docker-build-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build API Image (Dry Run)
        run: docker build -t ana-api:test -f src/serving/Dockerfile .

      - name: Build Airflow Image (Dry Run)
        run: |
          docker build -t ana-api:latest -f src/serving/Dockerfile .
          docker build -t airflow-test:latest -f Dockerfile.airflow .
